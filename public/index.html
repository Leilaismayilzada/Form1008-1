<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Information</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <header></header>
    <main>
        <section>
            <div class="container">
                <div class="container1">
                    <h1>Profile Information</h1>
                </div>

                <div class="main">
                    <div class="term1">
                        <div>
                            <label for="agency-name">Agency Name</label><br>
                            <input type="text" id="agency-name" required>
                        </div><br>
                        <div>
                            <label for="address">Address</label><br>
                            <input type="text" id="address" required>
                        </div><br>
                        <div>
                            <label for="toll-free">Toll-Free Number</label><br>
                            <input type="text" id="toll-free">
                        </div><br>
                        <div>
                            <label for="company-name">Company Name</label><br>
                            <input type="text" id="company-name">
                        </div><br>
                    </div>
                    <div class="term2">
                        <div>
                            <label for="agency-type">Agent Type</label><br>
                            <select id="agency-type" required>
                                <option value="agent">Agent</option>
                                <option value="broker">Broker</option>
                            </select>
                        </div><br>
                        <div class="location">
                            <div class="loc1">
                                <label for="city">City</label><br>
                                <input type="text" id="city" required>
                            </div>
                            <div class="loc2">
                                <label for="state">State</label><br>
                                <input type="text" id="state" required>
                            </div>
                        </div><br>
                        <div>
                            <label for="email">Email ID</label><br>
                            <input type="email" id="email" required>
                        </div><br>
                   
                    </div>
                    <div class="term3">
                        <div>
                            <label for="password">Password</label><br>
                            <input type="password" id="password" required>
                        </div><br>
                        <div>
                            <label for="phone-number">Phone Number</label><br>
                            <input type="tel" id="phone-number" required>
                        </div><br>
                        <div>
                            <label for="website">Website</label><br>
                            <input type="url" id="website">
                        </div><br>
                        <div>
                            <label for="company-logo">Company Logo</label><br>
                            <div class="file">
                                <input type="file" id="company-logo" multiple>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="pend">To process your registration, please provide the following information. Note that all fields marked with an asterisk (*) are required.</p>
                <div class="ends">
                    <div class="end">
                        <button type="button">Cancel</button>
                    </div>
                    <div class="end1">
                        <button type="submit">Continue <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
</body>

</html>
